# Кухонна техніка дому — з неї recipe_add пише кроки рецептів (ADR-0074).
# Джерело: Obsidian «Домашнє/перелік техніки на кухні», насадки й режими звірені
# зі сторінками виробників/магазинів 2026-10-05. Правиться вручну: модель бере
# пристрої, насадки і режими ЛИШЕ звідси, нічого понад це не вигадує.

devices:
  - id: kenwood_chef
    name: Kenwood Titanium Chef XL
    called: [кухонна машина, кенвуд, міксер]
    for: замішування тіста, збивання, кремів; база для насадок
    attachments:
      - name: K-насадка
        for: тісто для кексів, пісочне тісто, фарш, пюре — більшість змішувань
      - name: гнучкий збивач
        for: м'які маси, креми, вершкове масло з цукром, сирні маси — зчищає стінки
      - name: вінчик
        for: білки, вершки, бісквітне тісто — насичує повітрям
      - name: гак для тіста
        for: дріжджове тісто, хліб, піца — вимішування
      - name: фуд-процесор KAH647PL
        for: >-
          ніж — подрібнити; 6 дисків: тонка нарізка, товста нарізка, дрібна тертка, велика тертка,
          соломка (жульєн), дуже дрібна тертка (сир, шоколад)
      - name: м'ясорубка KAX950ME
        for: фарш з м'яса, риби, овочів
      - name: подрібнювач AT320A
        for: горіхи, спеції, кава, невеликі порції
      - name: насадка для розкачування тіста
        for: розкачати тісто тонкими пластами (паста, лазанья, пельмені)
    modes:
      - name: швидкість
        for: "значення min–max або імпульс: min–1 — додавання інгредієнтів, тісто гаком; 2–4 — змішування K-насадкою; max — вінчик"

  - id: hand_blender
    name: блендер Kenwood HDP408
    called: [блендер, занурювальний блендер]
    for: пюре, супи-пюре, соуси, смузі, невеликі подрібнення
    attachments:
      - name: ніжка Soup XL
        for: супи-пюре прямо в каструлі, соуси, смузі
      - name: ніжка-товкачка Masher Pro
        for: картопляне й овочеве пюре (2 диски — гладке чи з грудочками)
      - name: вінчик
        for: невеликі збивання — вершки, яйця
      - name: подрібнювач 0,5 л
        for: зелень, часник, цибуля, горіхи
      - name: склянка 0,75 л
        for: смузі, соуси, майонез

  - id: optigrill
    name: Tefal OptiGrill
    called: [optigrill, оптигриль, електрогриль, гриль, вафельниця]
    for: стейки, бургери, птиця, риба, сендвічі, овочі на грилі; вафлі
    attachments:
      - name: пластини для гриля
        for: усе, що на гриль
      - name: пластини для вафель
        for: вафлі
    modes:
      # Точна модель ще не відома — автопрограми залежать від моделі (6–16). До уточнення
      # модель пише лише ручний режим з температурою/часом, без назв автопрограм.
      - name: ручний режим
        for: усе; температура і час — як у рецепті

  - id: ninja_combi
    name: мультипіч Ninja Combi SFP700EU
    called: [ninja, нінзя, ніндзя, мультипіч, аерогриль, комбі]
    for: запікання, Air Fry, пара, гарнір і основна страва одночасно, випікання хліба
    attachments:
      - name: Combi-форма (Combi Pan)
        for: нижній рівень — рис/паста/овочі з рідиною, вода для пари
      - name: решітка (griddle)
        for: верхній рівень — м'ясо, риба, форма для випічки
      - name: пластина для хрусткості (crisp plate)
        for: Air Fry, хрусткі страви (фрі, крильця, паніровка)
    modes:
      - name: Combi Meals
        for: страва й гарнір разом (пара знизу + хрустка скоринка зверху)
      - name: Combi Crisp
        for: соковите всередині й хрустке зовні — курка, свинина, овочі
      - name: Combi Bake
        for: випічка з парою — хліб, кекси, сирники, запіканки
      - name: Rice/Pasta
        for: рис, паста, крупи
      - name: Sear/Sauté
        for: обсмажити в Combi-формі перед тушкуванням
      - name: Steam
        for: пара — овочі, риба, пельмені
      - name: Slow Cook
        for: тушкування на кілька годин
      - name: Proof
        for: розстоювання дріжджового тіста
      - name: Bake
        for: звичайне випікання й запікання без пари
      - name: Reheat
        for: розігріти
      - name: Air Fry
        for: фрі, крильця, паніровка, хрустке без олії
      - name: Grill
        for: зарум'янити зверху, гриль
